[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rawlslab-underscore"
version = "0.1.0rc1"
description = "Code-generated, measured, CC0 background music for developer videos. Runs on your machine, with a model account you already have."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Markell Rawls"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "pedalboard>=0.9",
    "librosa>=0.10",
    "python-osc>=1.8",
    "mutagen>=1.47",
]

[project.urls]
Homepage = "https://rawlslab.ai/underscore/"
Repository = "https://github.com/MarkellRawls/underscore"

[project.optional-dependencies]
video = ["scenedetect>=0.6", "opencv-python-headless>=4.8", "faster-whisper>=1.0", "webrtcvad-wheels>=2.0"]
mastering = ["matchering>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
underscore = "underscore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
underscore = ["prompts/*.md", "vendor/*.rb"]
