name: ci

on:
  push:
    branches: [master]
    tags: ["0.*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libatomic1 ffmpeg
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q tests

  tests-macos:
    # Decision 14: macOS only on release tags, manual runs, or the weekly schedule
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/0.')
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q tests

  synth-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libatomic1 ffmpeg
      - run: pip install -e .
      - name: Full pipeline on the synth engine
        run: |
          underscore init ci-bed --duration 30
          underscore score --brief ci-bed.brief.json --engine synth
          test -f out/ci-bed/manifest.json
          python -c "import json; m=json.load(open('out/ci-bed/manifest.json')); assert m['gate_passed'], m['gate_reasons']"

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libatomic1 ffmpeg
      - run: pip install build
      - run: python -m build
      - name: Install the wheel in a clean venv outside the checkout and run it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/underscore --help
          /tmp/smoke/bin/python -c "import importlib.resources as r; assert r.files('underscore').joinpath('prompts/compose.md').is_file(); assert r.files('underscore').joinpath('vendor/underscore-record.rb').is_file()"
          /tmp/smoke/bin/underscore init smoke --duration 20
          /tmp/smoke/bin/underscore score --brief smoke.brief.json --engine synth
