name: Publish

# Trusted publishing, no tokens: a tag like 0.1.0-rc.1 goes to TestPyPI, a tag
# like 0.1.0 goes to PyPI. The tag must match the version in pyproject.toml
# (rc tags map to PEP 440: 0.1.0-rc.1 is version 0.1.0rc1). One-time setup on
# each index: add a pending publisher for project rawlslab-underscore with owner
# MarkellRawls, repository underscore, workflow publish.yml, and the environment
# name below (testpypi or pypi).

on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the version in pyproject.toml
        run: |
          v=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          n=$(printf '%s' "$GITHUB_REF_NAME" | sed -E 's/-rc\.?([0-9]+)$/rc\1/')
          [ "$v" = "$n" ] || { echo "tag $GITHUB_REF_NAME (version $n) does not match pyproject version $v"; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y libatomic1 ffmpeg
      - run: pip install -q build && python -m build
      - name: The wheel installs outside the checkout and the synth pipeline runs
        run: |
          pip install -q dist/*.whl
          cd /tmp
          underscore --help >/dev/null
          underscore init smoke --duration 20
          underscore score --brief smoke.brief.json --engine synth
          python -c "import json; m=json.load(open('out/smoke/manifest.json')); assert m['gate_passed'], m['gate_reasons']"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
